<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom Management Recall | Education</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#122b43;background:#f5f8fc}*{box-sizing:border-box}body{margin:0;cursor:pointer;user-select:none}main{max-width:960px;margin:auto;padding:24px 22px 90px}h1{font-size:clamp(1.4rem,3vw,2rem);margin:15px 0 10px}h2{font-size:1.05rem;color:#466580;margin:34px 0 16px;border-bottom:1px solid #dce6f0;padding-bottom:8px}.sub{color:#5b6d80;line-height:1.6}.bar{position:sticky;top:0;background:#f5f8fcf2;z-index:3;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce6f0;padding:12px 0;gap:10px}.badge{background:#e3ecf5;border-radius:99px;padding:7px 12px;font-size:.8rem;color:#345573}.phrase{min-height:40px;display:flex;align-items:center;font-size:clamp(1.14rem,2.5vw,1.43rem);font-weight:600;line-height:1.45;margin-bottom:9px;white-space:pre-wrap}.phrase.hidden{color:transparent}.phrase.visible{color:#183c5c}.phrase.current{background:#e5f2ff;border-radius:6px;padding-left:6px;margin-left:-6px}.view{display:none}.view.active{display:block}.foot{font-size:.84rem;color:#64788d;padding:25px 0}a{color:#15559b}button{font:inherit;background:#fff;color:#235778;border:1px solid #c0cfdd;border-radius:7px;padding:6px 9px;cursor:pointer}.nav{display:flex;gap:8px}.nav button{min-width:39px}@media(max-width:600px){main{padding:16px 16px 75px}.phrase{min-height:37px}h2{margin-top:28px}}@media print{.view:not(.active),.nav{display:none}.phrase.hidden{display:none}.bar{position:static}}
</style></head><body><main><div class="bar"><a href="/stories.html">← Stories</a><strong>Classroom Management</strong><span id="counter" class="badge">0 / 5</span><div class="nav"><button id="back" aria-label="Previous phrase">←</button><button id="forward" aria-label="Next phrase">→</button><button id="restart" aria-label="Start again">↺</button></div></div><h1 id="title">Five big stages</h1><p class="sub">Tap anywhere or press → to reveal. Press ← to hide the previous phrase. Home restarts.</p><div id="stageView" class="view active"></div><div id="answerView" class="view"></div><p class="foot">Tap / → Forward · ← Back · Home Restart · End Show all · Space Forward</p></main>
<script>
'use strict';
const headings=["Diverse Needs and Strategies","Formative Assessment","Support and Challenge","Collaboration","Professional Philosophy"];
const paragraphs=[["Diverse Needs and Strategies",["My approach","to teaching classes","with diverse","academic, behavioural","and emotional needs","begins with","clear routines,","high expectations,","positive relationships","and differentiated instruction."]],["Formative Assessment",["I use","formative assessment","to establish","students' starting points,","to identify","misconceptions","and to adapt","my teaching."]],["Support and Challenge",["I provide","appropriate support","and challenge","so that all students","can participate","and progress."]],["Collaboration",["I also recognise","that some barriers","to learning extend","beyond the classroom.","I work collaboratively","with the SET department,","year head and","relevant student-support structures,","sharing observations","and assessment evidence","to support","appropriate interventions."]],["Professional Philosophy",["For me,","classroom management,","inclusion and pastoral care","are closely connected.","My responsibility is","to maintain a","productive learning environment","while recognising","and responding to","individual students' needs."]]];
const stageView=document.getElementById('stageView'),answerView=document.getElementById('answerView');
let mode=0,position=0;const total=paragraphs.reduce((n,p)=>n+p[1].length,0);
headings.forEach((v,i)=>{let el=document.createElement('div');el.className='phrase hidden';el.textContent=(i+1)+'. '+v;stageView.append(el)});
paragraphs.forEach((p,i)=>{let sec=document.createElement('section'),h=document.createElement('h2');h.textContent=(i+1)+'. '+p[0];sec.append(h);p[1].forEach(t=>{let el=document.createElement('div');el.className='phrase hidden';el.textContent=t;sec.append(el)});answerView.append(sec)});
function draw(){stageView.classList.toggle('active',mode===0);answerView.classList.toggle('active',mode===1);document.getElementById('title').textContent=mode===0?'Five big stages':'Complete spoken answer';document.getElementById('counter').textContent=position+' / '+(mode===0?5:total);let els=[...(mode===0?stageView:answerView).querySelectorAll('.phrase')];els.forEach((e,i)=>{e.classList.toggle('visible',i<position);e.classList.toggle('hidden',i>=position);e.classList.toggle('current',i===position-1)})}
function forward(){if(mode===0&&position===5){mode=1;position=0;scrollTo(0,0)}else if(position<(mode===0?5:total))position++;draw()}
function back(){if(position>0)position--;else if(mode===1){mode=0;position=5;scrollTo(0,0)}draw()}
function restart(){mode=0;position=0;scrollTo(0,0);draw()}
function end(){position=mode===0?5:total;draw()}
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','Enter','ArrowLeft','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();if(['ArrowRight','ArrowDown',' ','Enter'].includes(e.key))forward();else if(['ArrowLeft','ArrowUp'].includes(e.key))back();else if(e.key==='Home')restart();else end()}});
document.addEventListener('pointerup',e=>{if(e.target.closest('button,a'))return;if(e.button!==undefined&&e.button!==0)return;forward()});
document.getElementById('forward').onclick=forward;document.getElementById('back').onclick=back;document.getElementById('restart').onclick=restart;draw();
</script></body></html>
