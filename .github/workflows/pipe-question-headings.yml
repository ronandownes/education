name: Pipe question heading migration

on:
  push:
    paths:
      - '.github/workflows/pipe-question-headings.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert interview question headings to pipe metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          practice_dir = Path('content/practice')
          heading_re = re.compile(r'^(#{2,3}\s+)(.*)$')
          legacy_sep_re = re.compile(r'^(.*?)(?:\s+—\s+|\s+-\s+)(.+)$')

          # These were interview answers whose right-hand side had drifted into a
          # descriptor instead of the full question. Restore the question while
          # migrating the separator.
          special_headings = {
              'Yearly plan — second-year Maths': 'Yearly plan | If you were given a second-year Maths class in September, how would you plan the year?',
              'Yearly plan - second-year Maths': 'Yearly plan | If you were given a second-year Maths class in September, how would you plan the year?',
              'Yearly plan — first-year intake': 'First-year plan | How would you plan for a first-year Maths class at the start of the year?',
              'Yearly plan - first-year intake': 'First-year plan | How would you plan for a first-year Maths class at the start of the year?',
          }

          changed_files = []
          converted = 0
          for path in sorted(practice_dir.glob('*.md')):
              original = path.read_text(encoding='utf-8')
              out = []
              changed_here = 0
              for line in original.splitlines(keepends=True):
                  newline = '\n' if line.endswith('\n') else ''
                  core = line[:-1] if newline else line
                  m = heading_re.match(core)
                  if not m:
                      out.append(line)
                      continue

                  prefix, heading = m.groups()
                  heading = heading.strip()
                  if heading in special_headings:
                      replacement = special_headings[heading]
                      out.append(prefix + replacement + newline)
                      changed_here += 1
                      converted += 1
                      continue

                  if '|' in heading:
                      out.append(line)
                      continue

                  legacy = legacy_sep_re.match(heading)
                  if legacy:
                      handle, right = legacy.groups()
                      # Only convert true interview questions. Section headings and
                      # labels such as abbreviation keys remain ordinary headings.
                      if '?' in right:
                          out.append(f'{prefix}{handle.strip()} | {right.strip()}{newline}')
                          changed_here += 1
                          converted += 1
                          continue

                  out.append(line)

              updated = ''.join(out)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed_files.append(str(path))

          # Update the repository's editing convention so future questions use pipes.
          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          old = text
          text = text.replace('`## Short handle - Concise interview question?`', '`## Short handle | Concise interview question?`')
          text = text.replace('Use the ordinary keyboard **hyphen/minus** with one space on each side: ` - `.', 'Use the ordinary keyboard **pipe** as the structural separator: ` | `.')
          text = text.replace('Legacy headings using an em dash are still supported by the site, but new and edited headings should use ` - `.', 'Legacy headings using an em dash or spaced hyphen may still be interpreted during migration, but new and edited interview questions should use ` | `.')
          text = text.replace('Do not use the separator inside the short handle itself. Ordinary hyphens inside words such as `low-level` are fine because they are not surrounded by spaces.', 'Do not use `|` inside the short handle itself. Ordinary hyphens inside words such as `low-level` are fine.')
          text = text.replace('`## Positive relationship - When has a positive relationship helped with classroom management?`', '`## Positive relationship | When has a positive relationship helped with classroom management?`')
          if text != old:
              agents.write_text(text, encoding='utf-8')
              changed_files.append('AGENTS.md')

          # Make the CMS field itself remind the editor of the convention.
          pages = Path('.pages.yml')
          text = pages.read_text(encoding='utf-8')
          old = text
          text = text.replace('- { name: body, type: rich-text, label: Answers }', '- { name: body, type: rich-text, label: "Answers (handle | question)" }')
          if text != old:
              pages.write_text(text, encoding='utf-8')
              changed_files.append('.pages.yml')

          # On the live page, keep the short handle as metadata and show only the
          # full question. Store both values in data attributes before any other
          # page scripts run so audio/retrieval features see the clean question.
          layout = Path('_layouts/doc.html')
          text = layout.read_text(encoding='utf-8')
          old = text
          marker = '      <div class="doc-body" id="docBody">{{ content }}</div>\n'
          normaliser = '''      <div class="doc-body" id="docBody">{{ content }}</div>\n      <script>\n        (() => {\n          const body = document.getElementById('docBody');\n          if (!body) return;\n          body.querySelectorAll(':scope > h2, :scope > h3').forEach(heading => {\n            const raw = heading.textContent.replace(/\\s+/g, ' ').trim();\n            const pipeIndex = raw.indexOf('|');\n            if (pipeIndex < 0) return;\n            const menuLabel = raw.slice(0, pipeIndex).trim();\n            const questionText = raw.slice(pipeIndex + 1).trim();\n            if (!menuLabel || !questionText) return;\n            heading.dataset.menuLabel = menuLabel;\n            heading.dataset.questionText = questionText;\n            heading.textContent = questionText;\n            heading.classList.add('interview-question-heading');\n          });\n        })();\n      </script>\n'''
          if 'heading.dataset.menuLabel = menuLabel;' not in text:
              if marker not in text:
                  raise SystemExit('Could not find docBody marker in _layouts/doc.html')
              text = text.replace(marker, normaliser, 1)

          old_menu_line = "          link.textContent = heading.textContent.trim();"
          new_menu_lines = "          const rawHeadingText = heading.textContent.trim();\n          const pipeIndex = rawHeadingText.indexOf('|');\n          link.textContent = heading.dataset.menuLabel || (pipeIndex >= 0 ? rawHeadingText.slice(0, pipeIndex).trim() : rawHeadingText);"
          if old_menu_line in text:
              text = text.replace(old_menu_line, new_menu_lines, 1)
          elif 'heading.dataset.menuLabel ||' not in text:
              raise SystemExit('Could not find dropdown heading label line in _layouts/doc.html')

          if text != old:
              layout.write_text(text, encoding='utf-8')
              changed_files.append('_layouts/doc.html')

          print(f'Converted {converted} interview question headings.')
          print('Changed files:')
          for item in changed_files:
              print(f'  - {item}')
          if converted == 0:
              raise SystemExit('No legacy interview question headings were converted; refusing an empty migration.')
          PY

      - name: Commit migrated headings and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/practice AGENTS.md .pages.yml _layouts/doc.html
          git rm .github/workflows/pipe-question-headings.yml
          git commit -m "Use pipe metadata for interview question headings"
          git push
