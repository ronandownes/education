name: Remove legacy interview tables

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-practice-tables.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy tables without touching interview questions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          practice_dir = Path('content/practice')
          table_sep = re.compile(r'^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$')
          legacy_heading = re.compile(r'(retrieval|breadcrumb|word\s*wall)', re.I)
          html_table = re.compile(r'\n?<table\b[^>]*>.*?</table>\n?', re.I | re.S)

          changed_files = []
          removed_tables = 0

          def protected_headings(text):
              out = []
              for line in text.splitlines():
                  if re.match(r'^##\s+', line) and not legacy_heading.search(line):
                      out.append(line)
              return out

          for path in sorted(practice_dir.glob('*.md')):
              original = path.read_text(encoding='utf-8')
              before_headings = protected_headings(original)
              lines = original.splitlines(keepends=True)
              remove = set()

              i = 0
              while i < len(lines) - 1:
                  header = lines[i].rstrip('\r\n')
                  sep = lines[i + 1].rstrip('\r\n')
                  if '|' in header and table_sep.match(sep):
                      start = i
                      end = i + 2
                      while end < len(lines):
                          row = lines[end].rstrip('\r\n')
                          if not row.lstrip().startswith('|'):
                              break
                          end += 1

                      # Remove the table itself.
                      remove.update(range(start, end))
                      removed_tables += 1

                      # If the table belongs to an old retrieval/breadcrumb/word-wall
                      # section, remove that obsolete heading and the blank lines between.
                      j = start - 1
                      while j >= 0 and not lines[j].strip():
                          remove.add(j)
                          j -= 1
                      if j >= 0 and re.match(r'^##\s+', lines[j]) and legacy_heading.search(lines[j]):
                          remove.add(j)
                          k = j - 1
                          while k >= 0 and not lines[k].strip():
                              # Keep front-matter separation intact; only trim local blanks.
                              if k > 0 and lines[k-1].strip() == '---':
                                  break
                              remove.add(k)
                              k -= 1
                      i = end
                      continue
                  i += 1

              updated = ''.join(line for idx, line in enumerate(lines) if idx not in remove)
              updated, html_count = html_table.subn('\n', updated)
              removed_tables += html_count

              # Normalise only excessive blank lines created by deletion.
              updated = re.sub(r'\n{4,}', '\n\n\n', updated)

              after_headings = protected_headings(updated)
              if after_headings != before_headings:
                  raise SystemExit(f'Protected H2 headings changed in {path}; aborting cleanup.')

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed_files.append(str(path))

          if removed_tables == 0:
              raise SystemExit('No legacy tables found; refusing empty cleanup.')

          print(f'Removed {removed_tables} legacy table(s).')
          print('Changed files:')
          for item in changed_files:
              print(f'  - {item}')
          PY

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/practice
          git rm .github/workflows/remove-legacy-practice-tables.yml
          git commit -m "Remove legacy interview retrieval tables"
          git push
