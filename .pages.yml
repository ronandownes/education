media:
  input: assets/uploads
  output: /assets/uploads
content:
  - name: home
    label: Home
    type: file
    path: index.md
    format: yaml-frontmatter
    fields:
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, label: Title }
      - { name: eyebrow, type: string, label: Eyebrow }
      - { name: intro, type: text, label: Introduction }
      - { name: body, type: rich-text, label: Page content }
  - name: practice
    label: Practice
    type: group
    items:
      - { name: teaching, label: Teaching & Learning, type: file, path: content/practice/teaching-learning.md, format: yaml-frontmatter, fields: &docfields [ { name: layout, type: string, hidden: true }, { name: permalink, type: string, hidden: true }, { name: title, type: string, label: Title }, { name: eyebrow, type: string, label: Eyebrow }, { name: intro, type: text, label: Introduction }, { name: body, type: rich-text, label: Answers } ] }
      - { name: classroom, label: Classroom Management, type: file, path: content/practice/classroom-management.md, format: yaml-frontmatter, fields: *docfields }
      - { name: sen, label: SEN / AEN & Inclusion, type: file, path: content/practice/sen-inclusion.md, format: yaml-frontmatter, fields: *docfields }
      - { name: differentiation, label: Differentiation & Accessibility, type: file, path: content/practice/differentiation-accessibility.md, format: yaml-frontmatter, fields: *docfields }
      - { name: assessment, label: Assessment & Reporting, type: file, path: content/practice/assessment-reporting.md, format: yaml-frontmatter, fields: *docfields }
      - { name: planning, label: Planning & Curriculum, type: file, path: content/practice/planning-curriculum.md, format: yaml-frontmatter, fields: *docfields }
      - { name: relationships, label: Relationships & Wellbeing, type: file, path: content/practice/relationships-wellbeing.md, format: yaml-frontmatter, fields: *docfields }
      - { name: professional, label: Professional Responsibility, type: file, path: content/practice/professional-practice.md, format: yaml-frontmatter, fields: *docfields }
  - name: schools
    label: Schools
    type: group
    items:
      - { name: stpatricks, label: St Patrick's Comprehensive, type: file, path: content/schools/st-patricks.md, format: yaml-frontmatter, fields: *docfields }
  - name: subjects
    label: Subjects
    type: collection
    path: content/subjects
    format: yaml-frontmatter
    operations: { create: false, delete: false }
    fields: *docfields
  - name: interview
    label: Interview
    type: group
    items:
      - { name: stpatricksnote, label: St Patrick's Interview Note, type: file, path: content/interview/st-patricks.md, format: yaml-frontmatter, fields: *docfields }
